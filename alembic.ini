# Alembic 迁移配置
# 04-ENGUIDE §10 + 03-SCHEMA §10
# 实际迁移在 migrations/versions/ 下，由 T-003 创建 0001_initial_schema.py

[alembic]
# 迁移脚本所在目录
script_location = migrations

# 迁移文件命名模板
file_template = %%(rev)s_%%(slug)s

# 时区（生成的迁移文件元数据时间戳）
timezone = UTC

# 迁移文件最大长度（slug 截断点）
truncate_slug_length = 40

# 数据库连接 URL — 由环境变量 DATABASE_URL 注入（migrations/env.py 内读）
# sqlalchemy.url = （留空，env.py 从环境变量读）

# 输出 SQL 而非执行（--sql 模式默认行为）
revision_environment = false

# 版本编号格式：使用短 hash（默认）
version_num_format = %%(rev)s

[post_write_hooks]
# 迁移生成后自动跑 ruff format
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ─── 日志 ─────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
